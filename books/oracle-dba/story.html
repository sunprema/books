<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oracle DBA — Story: The Life of One Saved Order</title>
<style>
/* Storyboard prototype — swiss tokens verbatim; self-contained, offline. */
:root{
  --accent:#e63329; --bg:#ffffff; --bg-2:#f4f4f1; --cm:#8a8a85;
  --code-bg:#f6f6f4; --ink:#111111; --ink-soft:#61615d; --rule:#e3e3df;
  --font-body:"Helvetica Neue",Helvetica,-apple-system,Arial,sans-serif;
  --font-display:"Helvetica Neue",Helvetica,-apple-system,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --topbar-h:3rem; --nav-h:3.2rem;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{
  color:var(--ink); background:var(--bg);
  background-image:linear-gradient(180deg,#ffffff 0%,#f6f6f3 100%);
  background-attachment:fixed;
  font-family:var(--font-body); font-size:clamp(15px,1.15vw,18px); line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{ color:var(--accent); text-decoration:none; }
a:hover{ text-decoration:underline; }

.book-top{
  position:fixed; top:0; left:0; right:0; height:var(--topbar-h); z-index:5;
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:0 5vw; background:var(--bg); border-bottom:1px solid var(--rule);
  font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
}
.book-top .t{ font-weight:800; }
.book-top nav{ display:flex; gap:1.5rem; }
.book-top a{ color:var(--ink-soft); }
.book-top a:hover{ color:var(--accent); text-decoration:none; }

.stage-wrap{
  position:fixed; inset:0; padding:calc(var(--topbar-h) + 1.4rem) 5vw var(--nav-h);
  display:grid; grid-template-columns:3fr 2fr; gap:4vw; align-items:center;
}
.spine{ position:fixed; top:var(--topbar-h); bottom:var(--nav-h); left:calc(5vw + (90vw - 4vw) * 3 / 5 + 2vw); width:1px; background:var(--rule); }

.stage{ border-top:4px solid var(--ink); padding-top:1rem; }
.stage svg{ width:100%; height:auto; display:block; }

.panel{ border-top:4px solid var(--ink); padding-top:1rem; min-height:60vh; display:flex; flex-direction:column; }
.scene-num{
  font-size:clamp(5rem,9vw,9rem); font-weight:800; line-height:.8;
  letter-spacing:-.06em; color:var(--rule); margin:0 0 -.3em -.04em; user-select:none;
}
.kicker{ font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 .5rem; position:relative; }
.panel h1{ font-family:var(--font-display); font-size:clamp(1.5rem,2.4vw,2.2rem); font-weight:800; letter-spacing:-.03em; line-height:1.05; margin:0 0 .8rem; position:relative; }
.caption{ font-size:1.08em; margin:0 0 1rem; position:relative; }
.caption b{ color:var(--accent); }
.claims{ margin-top:auto; padding-top:.8rem; border-top:1px solid var(--rule); font-size:.74rem; color:var(--ink-soft); }
.panel .fade{ transition:opacity .35s ease; }
.panel.switching .fade{ opacity:0; }

.book-nav{
  position:fixed; left:0; right:0; bottom:0; height:var(--nav-h); z-index:5;
  display:flex; gap:1.6rem; justify-content:center; align-items:center;
  background:var(--bg); border-top:1px solid var(--rule);
  font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
}
.book-nav button{
  font:inherit; letter-spacing:inherit; text-transform:inherit; font-weight:700;
  border:0; background:none; color:var(--ink); cursor:pointer; padding:.4rem .6rem;
}
.book-nav button:hover{ color:var(--accent); }
.book-nav button:disabled{ color:var(--rule); cursor:default; }
.dots{ display:flex; gap:.55rem; }
.dots button{ width:.62rem; height:.62rem; padding:0; border-radius:50%; background:var(--rule); }
.dots button[aria-current="true"]{ background:var(--accent); }
.dots button:hover{ background:var(--ink-soft); }

/* ───────────────────────── SVG stage ───────────────────────── */
svg text{ font-family:var(--font-body); font-size:8px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; fill:var(--ink-soft); }
svg text.big{ font-size:10.5px; letter-spacing:-.01em; text-transform:none; fill:var(--ink); }
svg text.mono{ font-family:var(--font-mono); text-transform:none; letter-spacing:0; }
svg text.red{ fill:var(--accent); }
.stroke{ stroke:var(--ink); stroke-width:1; fill:none; }
.stroke-soft{ stroke:var(--rule); stroke-width:1; fill:none; }
.stroke-thick{ stroke:var(--ink); stroke-width:2; fill:none; }
.fill-soft{ fill:var(--bg-2); }
.fill-bg{ fill:var(--bg); }

/* every animated element transitions between scene states */
.st{ transition:opacity .5s ease, transform .8s cubic-bezier(.6,.02,.3,1), fill .5s ease, stroke .5s ease; }
.tk{ opacity:0; }                      /* tokens: hidden until a scene lights them */
.ann{ opacity:0; transition:opacity .5s ease .35s; }

/* active-arrow draw-in */
.wire{ stroke:var(--accent); stroke-width:1.6; fill:none; opacity:0; }
.wire.on{ opacity:1; animation:draw .9s ease forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }
.pulse{ animation:pulse 1.6s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
@keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

/* region/process highlight */
.box{ fill:var(--bg); stroke:var(--ink); stroke-width:1; }
.lit > rect{ stroke:var(--accent); stroke-width:1.8; }
.lit > text{ fill:var(--accent); }

/* ── scene states (body[data-scene]) ─────────────────────────── */
/* s0: the two halves */
body[data-scene="0"] #lbl-instance, body[data-scene="0"] #lbl-disk{ fill:var(--accent); }
body[data-scene="0"] #r-instance, body[data-scene="0"] #r-disk{ stroke:var(--ink); stroke-width:2; }

/* s1: ask + parse */
body[data-scene="1"] #g-server rect, body[data-scene="1"] #g-pool > rect{ stroke:var(--accent); stroke-width:1.8; }
body[data-scene="1"] #sql-dot{ opacity:1; transform:translate(160px,186px); }
#sql-dot{ transform:translate(112px,173px); }
body[data-scene="1"] #plan{ opacity:1; }
body[data-scene="1"] #ann-ask{ opacity:1; }

/* s2: read up into cache */
body[data-scene="2"] #cache-blk{ opacity:1; }
body[data-scene="2"] #g-cache > rect:first-of-type{ stroke:var(--accent); stroke-width:1.8; }
body[data-scene="2"] #ann-read{ opacity:1; }
#disk-blk{ opacity:1; }

/* s3: dirty + redo/undo notes */
body[data-scene="3"] #cache-blk{ opacity:1; fill:var(--accent); stroke:var(--accent); }
body[data-scene="3"] #redo-s1, body[data-scene="3"] #redo-s2{ opacity:1; }
body[data-scene="3"] #undo-chip{ opacity:1; }
body[data-scene="3"] #ann-change{ opacity:1; }

/* s4: commit — flush to redo log */
body[data-scene="4"] #cache-blk{ opacity:1; fill:var(--accent); stroke:var(--accent); }
body[data-scene="4"] #g-lgwr rect{ stroke:var(--accent); stroke-width:1.8; }
body[data-scene="4"] #log-s1, body[data-scene="4"] #log-s2{ opacity:1; }
body[data-scene="4"] #ack{ opacity:1; }
body[data-scene="4"] #ann-commit, body[data-scene="4"] #ann-commit2{ opacity:1; }
body[data-scene="4"] #undo-chip{ opacity:1; }

/* s5: lazy tidy-up */
body[data-scene="5"] #cache-blk{ opacity:1; }
body[data-scene="5"] #disk-blk{ fill:var(--accent); stroke:var(--accent); }
body[data-scene="5"] #g-dbwn rect, body[data-scene="5"] #g-ckpt rect{ stroke:var(--accent); stroke-width:1.8; }
body[data-scene="5"] #log-s1, body[data-scene="5"] #log-s2{ opacity:1; }
body[data-scene="5"] #ack{ opacity:1; }
body[data-scene="5"] #ckpt-mark{ opacity:1; transform:translate(26px,0); fill:var(--accent); }
#ckpt-mark{ transform:translate(0,0); fill:var(--ink-soft); }
body[data-scene="5"] #cf-dot{ opacity:1; animation:pulse 1.6s ease-in-out infinite; }
body[data-scene="5"] #ann-later{ opacity:1; }

/* s6: crash + recovery */
body[data-scene="6"] #g-sga, body[data-scene="6"] #g-crew-dim, body[data-scene="6"] #sql-dot, body[data-scene="6"] #plan, body[data-scene="6"] #lbl-instance{ opacity:.18; }
body[data-scene="6"] #bolt{ opacity:1; }
body[data-scene="6"] #g-smon rect{ stroke:var(--accent); stroke-width:1.8; }
body[data-scene="6"] #g-smon{ opacity:1; }
body[data-scene="6"] #log-s1, body[data-scene="6"] #log-s2{ opacity:1; }
body[data-scene="6"] #ack{ opacity:1; }
body[data-scene="6"] #ckpt-mark{ opacity:1; transform:translate(26px,0); fill:var(--accent); }
body[data-scene="6"] #saved-blk{ opacity:1; }
body[data-scene="6"] #ann-crash, body[data-scene="6"] #ann-crash2{ opacity:1; }

@media (prefers-reduced-motion: reduce){
  .st,.ann,.panel .fade{ transition:none !important; }
  .wire.on{ animation:none; stroke-dashoffset:0 !important; }
  .pulse{ animation:none; }
}

@media (max-width:900px){
  .stage-wrap{ position:static; display:block; padding:calc(var(--topbar-h) + 1rem) 6vw calc(var(--nav-h) + 1rem); }
  .spine{ display:none; }
  .panel{ min-height:0; margin-top:1.2rem; }
  .scene-num{ font-size:4.5rem; }
  .book-nav{ position:fixed; }
}
@media print{ .book-top,.book-nav,.spine{ display:none; } .stage-wrap{ position:static; } }
</style>

<!-- Canonical scene data lives in story.json; this is an embedded copy so the

<script id="story-data" type="application/json">
{"scenes":[
 {"title":"Two things with one name",
  "caption":"People say “the database” and mean one thing. It is two. The <b>files on disk</b> keep the orders when the lights are off. The <b>memory and the little worker crew</b> — the “instance” — are awake only while it runs. The whole story is these two halves talking.",
  "claims":"research.json · oracle-architecture · claims 1–2 — Oracle Database Concepts, 19c"},
 {"title":"The ask arrives",
  "caption":"The order app says: <b>save this order</b>. A server process picks it up and first checks the shared pool: have we heard this exact kind of ask before? If yes, reuse the old plan (a <b>soft parse</b>). If no, build a new one — that costs more.",
  "claims":"research.json · claims 3 — Oracle Database Concepts, 19c"},
 {"title":"Fetch the shelf, not the warehouse",
  "caption":"The block that holds this customer's rows is <b>copied from the datafile into the buffer cache</b> — the working table in memory. Changes never happen down on the disk shelf. They happen on the copy.",
  "claims":"research.json · claims 4 — Oracle Database Concepts, 19c"},
 {"title":"The change happens in memory",
  "caption":"The row is changed on the cached copy, which is now <b>dirty</b> — different from its disk twin. Two notes are written at the same moment: a <b>redo note</b> (how to do it again) and an <b>undo note</b> (how to take it back). The datafile has not been touched.",
  "claims":"research.json · claims 4 — Oracle Database Concepts, 19c"},
 {"title":"COMMIT — the only write that matters now",
  "caption":"The app says COMMIT. <b>LGWR writes the redo notes to the online redo log on disk.</b> The session waits for exactly that one write (“log file sync”) — then “done” goes back to the app. The order's data block is still only in memory. That is fine: the redo note on disk is the promise.",
  "claims":"research.json · claims 5–6 — Oracle Database Concepts, 19c"},
 {"title":"The slow tidy-up",
  "caption":"Later, on its own schedule, <b>DBWn</b> copies dirty blocks down to the datafiles. <b>CKPT</b> moves a bookmark — the checkpoint — forward in the control file and datafile headers: everything before this point is safely on disk. No one is waiting on any of this.",
  "claims":"research.json · claims 5, 7 — Oracle Database Concepts, 19c"},
 {"title":"The power goes out. The order survives.",
  "caption":"Crash. Memory is gone — the dirty block with it. On restart, <b>SMON replays the redo log from the checkpoint forward</b>, rebuilding every promised change; then undo rolls back whatever was never committed. The committed order comes back. <b>That is why COMMIT waited on the redo write and nothing else.</b>",
  "claims":"research.json · claims 8 — Oracle Database Concepts, 19c"}
]}
</script>

<script>
(function(){
  var scenes = JSON.parse(document.getElementById('story-data').textContent).scenes;
  // each wire draws over its own true length (fixed dasharray leaves long paths half-drawn)
  Array.prototype.forEach.call(document.querySelectorAll('.wire'), function(w){
    var L = Math.ceil(w.getTotalLength());
    w.style.strokeDasharray = L; w.style.strokeDashoffset = L;
  });
  var n = scenes.length, i = 0;
  var panel = document.querySelector('.panel');
  var wires = { 1:'w-sql', 2:'w-read', 4:'w-flush', 5:'w-write', 6:'w-replay' };
  var dots = document.getElementById('dots');
  for (var k = 0; k < n; k++) (function(k){
    var b = document.createElement('button');
    b.setAttribute('aria-label', 'Scene ' + (k+1));
    b.addEventListener('click', function(){ go(k); });
    dots.appendChild(b);
  })(k);

  function render(){
    document.body.dataset.scene = i;
    document.getElementById('p-num').textContent = i + 1;
    document.getElementById('p-kicker').textContent = 'Scene ' + (i+1) + ' of ' + n;
    document.getElementById('p-title').textContent = scenes[i].title;
    document.getElementById('p-caption').innerHTML = scenes[i].caption;
    document.getElementById('p-claims').textContent = 'Grounded in ' + scenes[i].claims;
    document.getElementById('b-prev').disabled = (i === 0);
    document.getElementById('b-next').textContent = (i === n-1) ? 'Read chapter 01 ›' : 'Next ›';
    Array.prototype.forEach.call(dots.children, function(d, k){
      if (k === i) d.setAttribute('aria-current','true'); else d.removeAttribute('aria-current');
    });
    // restart the scene's wire draw-in
    Array.prototype.forEach.call(document.querySelectorAll('.wire'), function(w){ w.classList.remove('on'); });
    var wid = wires[i];
    if (wid){ var w = document.getElementById(wid); void w.getBoundingClientRect(); w.classList.add('on'); }
    if (history.replaceState) history.replaceState(null, '', '#s' + (i+1));
  }
  function go(k){
    if (k < 0) return;
    if (k > n-1){ location.href = 'concepts/01-oracle-architecture.html'; return; }
    if (k === i) return;
    i = k;
    panel.classList.add('switching');
    setTimeout(function(){ render(); panel.classList.remove('switching'); },
      matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 180);
  }
  document.getElementById('b-prev').addEventListener('click', function(){ go(i-1); });
  document.getElementById('b-next').addEventListener('click', function(){ go(i+1); });
  document.addEventListener('keydown', function(e){
    if (window.__bookbankNav || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight'){ go(i+1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft'){ go(i-1); e.preventDefault(); }
    else if (e.key === 'ArrowUp'){ go(0); e.preventDefault(); }
  });
  var m = /^#s(\d+)$/.exec(location.hash);
  if (m) i = Math.min(Math.max(parseInt(m[1],10)-1, 0), n-1);
  render();
})();
</script>
</body>
</html>
