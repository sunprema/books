name: Publish on book merge

# Fires when a book lands on main — i.e. a fully art-complete book PR merges,
# pushing changes under books/**. The book was NEVER on Pages before this
# (it lived on its PR branch, art was placed there first), so the FIRST time
# it's ever live it's already complete — no prompt placeholders, ever, in
# anyone's cache. This job just regenerates the generated front door.
#
# Loop-safety: the regen DOES write under books/** (see the commit step), so
# the publish commit re-matches the `paths` filter below. The `if:` guard on
# the job skips our own commits — that is what breaks the loop, NOT committing
# less than the generator wrote.
on:
  push:
    branches: [main]
    paths:
      - 'books/**'
  # Manual re-run of the regen (Actions → Run workflow, or `gh workflow run
  # publish-on-merge.yml`) — e.g. after bumping the kit pin above so the shelf
  # picks up generator changes without waiting for the next book merge.
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    # The publish commit touches books/**, so it re-matches the paths filter.
    # Skip our own commits rather than under-committing to avoid the loop. The
    # regen is idempotent anyway (chip/OG injection use idempotency markers,
    # offline.json is content-hashed), so this only saves a wasted run.
    if: github.event.head_commit.author.name != 'bookbank-bot'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      # build-library.py + defaults/personas from the pinned kit plugin.
      # Bump the SHA deliberately to adopt kit's shelf/generator fixes.
      - name: Fetch bookbank plugin (pinned)
        run: |
          git clone --filter=blob:none --sparse https://github.com/sunprema/kit /tmp/kit
          git -C /tmp/kit sparse-checkout set bookbank/library bookbank/defaults
          git -C /tmp/kit checkout 0d0c77cc26204a3396acfe13ed005dc29e737a96

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Regenerate index.html + catalog.json IN PLACE from the book.json's on
      # main. --root == --out == "." → same-clone, no re-sync. CLAUDE_PLUGIN_ROOT
      # is required or persona names render blank. `sips` share-JPEG is macOS-only
      # and skipped gracefully on Ubuntu (cosmetic).
      - name: Rebuild shelf & catalog
        env:
          CLAUDE_PLUGIN_ROOT: /tmp/kit/bookbank
        run: |
          python3 /tmp/kit/bookbank/library/build-library.py \
            --out . --root . --repo "${{ github.repository }}"

      - name: Commit regenerated output
        run: |
          git config user.name  "bookbank-bot"
          git config user.email "bookbank-bot@users.noreply.github.com"
          # `git add -A`, never a narrow add. build-library.py writes generated
          # output into books/** as well as the front door:
          #   books/*/offline.json        the shelf's ⤓ Offline button fetches this
          #   books/*/**.html             ⌂ Library chip + share-preview <meta> tags
          #   books/*/assets/img/og-share.jpg
          # Adding only index.html/catalog.json/assets ships a working-LOOKING
          # site: catalog.json carries each book's offline_bytes (computed in
          # memory, so the button renders a correct-looking size) while the
          # offline.json it fetches was never pushed. That is how what-is-oauth,
          # jwts-promises-and-betrayals, entire-io and zig-memory-allocators
          # shipped with dead Offline buttons. Loop-safety is the job-level
          # `if:` guard above, not a narrow add.
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::Library already current — nothing to publish."
            exit 0
          fi
          git commit -m "Publish: rebuild library after ${{ github.sha }}"
          git push origin main
      # GitHub Pages auto-deploys the push to main.
